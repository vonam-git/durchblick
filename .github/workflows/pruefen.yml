name: Prüfen

on:
  push:
    branches: [main, develop]
  pull_request:

permissions:
  contents: read

jobs:
  pruefen:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python: ["3.9", "3.13"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Abhängigkeiten
        run: python -m pip install -r requirements-dev.txt
      - name: Tests und Sicherheits-Scans
        run: bash scripts/pruefen.sh
